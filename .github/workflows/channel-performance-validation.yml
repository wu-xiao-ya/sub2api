name: Channel Performance Validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel-performance-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: performance_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: performance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U performance_test -d performance_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PERFORMANCE_TEST_DATABASE_URL: postgres://performance_test:isolated_ci_only@127.0.0.1:5432/performance_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Protocol, visibility, billing-isolation, and lifecycle regressions
        working-directory: backend
        run: go test -p 2 ./internal/service ./internal/handler ./internal/handler/dto ./internal/repository ./internal/server/routes ./cmd/server -run 'TestPerformance|TestLatency|TestOpenAIGatewayService_ProxyResponsesWebSocketFromClient|TestProxyOpenAIWSHTTPBridge|TestOpenAIWSPassthrough|TestPassthroughLifecycle|TestHTTPUpstream|TestOpsErrorLogger|TestUsageRecordTaskFreezesLatency|TestUsageLatencyDTOUserAndAdmin|TestProvideCleanup' -count=1 -v
      - name: Isolated schema and real PostgreSQL aggregation tests
        working-directory: backend
        run: go test ./internal/repository -run '^TestPerformanceDatabase' -count=1 -v
      - name: Billing identity, images, subscriptions and credential refresh regressions
        working-directory: backend
        run: go test -p 2 ./internal/service -run 'TestOpenAIGatewayServiceRecordUsage|TestGatewayServiceRecordUsage|TestPostUsageBillingPurchaseFallback|TestGeminiOAuthService_Refresh|TestOAuthService_Refresh|TestOpenAIOAuthService.*Refresh|TestGrokOAuthServiceRefresh' -count=1 -v
      - name: Concurrent turn timing and telemetry race checks
        working-directory: backend
        run: go test -race -p 2 ./internal/service -run 'TestLatency|TestPerformanceRuntime|TestPerformanceWebSocket|TestOpenAIWSPassthroughTurnLifecycle|TestOpenAIGatewayService_ProxyResponsesWebSocketFromClient_(KeepLeaseAcrossTurns|PassthroughModeRelaysByCaddyAdapter|HTTPBridgeModeRelaysHTTPStream)' -count=1
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm exec vitest run src/composables/__tests__/useChannelPerformance.spec.ts src/components/channels/__tests__ src/components/admin/usage/__tests__/UsageTable.spec.ts src/utils/__tests__/usageLatencyStages.spec.ts src/utils/__tests__/brandRegistry.spec.ts --maxWorkers=2 --minWorkers=1
