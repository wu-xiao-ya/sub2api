name: Build Custom Sub2API Image

on:
  push:
    branches:
      - codex/consumption-concurrency
      - codex/channel-monitor-v2-hybrid
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sub2api:custom-consumption-concurrency
            ghcr.io/${{ github.repository_owner }}/sub2api:custom-${{ github.sha }}
          build-args: |
            VERSION=0.1.162-custom
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
