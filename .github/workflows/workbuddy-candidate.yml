name: WorkBuddy Plugin Candidate
on:
  workflow_dispatch:
  push:
    branches: [codex/workbuddy-deepseek-plugin-20261107]
permissions:
  contents: read
concurrency:
  group: workbuddy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: plugin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      SUB2API_PLUGIN_TEST_DATABASE_URL: postgres://postgres:fixture@127.0.0.1:5432/plugin_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Backend tests and builds
        working-directory: backend
        run: |
          go test ./...
          CGO_ENABLED=0 go build -o ../artifacts/sub2api ./cmd/server
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o ../artifacts/workbuddy-linux-$arch ./plugins/workbuddy
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o ../artifacts/workbuddy-windows-amd64.exe ./plugins/workbuddy
      - uses: actions/upload-artifact@v6
        with:
          name: workbuddy-candidate-${{ github.sha }}
          path: artifacts/
          retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint:check
          pnpm test:run
          pnpm build
      - uses: actions/upload-artifact@v6
        with:
          name: workbuddy-frontend-${{ github.sha }}
          path: frontend/dist/
          retention-days: 14

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/wu-xiao-ya/sub2api:workbuddy-candidate-${{ github.sha }}
          build-args: |
            VERSION=0.2.18-workbuddy-candidate
            COMMIT=${{ github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
      - name: Record immutable candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/wu-xiao-ya/sub2api@$DIGEST" > candidate-image.txt
      - uses: actions/upload-artifact@v6
        with:
          name: workbuddy-image-${{ github.sha }}
          path: candidate-image.txt
          retention-days: 30
